{{template "layout.html" .}}
{{define "content"}}
<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card glass-card p-5">
    <div class="text-center mb-4">
      <div class="auth-logo">🍗</div>
      <h1 class="auth-title">สมัครสมาชิก</h1>
      <p class="text-muted">เข้าร่วมครอบครัว Seoul Chic วันนี้!</p>
    </div>
    <form action="/register" method="POST" id="registerForm" novalidate>
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <div class="mb-3">
        <label for="name" class="form-label">ชื่อ-นามสกุล</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="name" name="name"
                 placeholder="ชื่อของคุณ" required autocomplete="name">
        </div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">อีเมล</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="your@email.com" required autocomplete="email">
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">รหัสผ่าน</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="อย่างน้อย 8 ตัวอักษร" required minlength="8">
          <button class="btn btn-outline-secondary" type="button" id="togglePass">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <div class="mb-4">
        <label for="confirm_password" class="form-label">ยืนยันรหัสผ่าน</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                 placeholder="กรอกรหัสผ่านอีกครั้ง" required>
        </div>
        <div id="pwMatchFeedback" class="form-text"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-kfry w-100 mb-3" id="registerBtn">
        <i class="bi bi-person-plus me-2"></i>สมัครสมาชิก
      </button>
    </form>
    <p class="text-center mb-0">
      มีบัญชีแล้ว? <a href="/login" class="link-accent">เข้าสู่ระบบ</a>
    </p>
  </div>
</div>
{{end}}
