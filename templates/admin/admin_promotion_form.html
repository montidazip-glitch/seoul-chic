{{template "layout.html" .}}
{{define "content"}}
<div class="container py-4" style="max-width: 680px">
  <div class="mb-4">
    <a href="/admin/promotions" class="btn btn-sm btn-outline-secondary mb-3">
      <i class="bi bi-arrow-left me-1"></i>กลับไปรายการโปรโมชั่น
    </a>
    <h1 class="page-title">{{.Title}}</h1>
  </div>

  <div class="glass-card p-4">
    <form action="{{if .Promotion}}/admin/promotions/{{.Promotion.ID}}/edit{{else}}/admin/promotions/new{{end}}" method="POST">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

      <div class="row g-3">
        <!-- Promo Code -->
        <div class="col-md-6">
          <label class="form-label fw-bold">รหัสโปรโมชั่น (Code) <span class="text-danger">*</span></label>
          <input type="text" name="code" class="form-control text-uppercase font-monospace fw-bold" placeholder="เช่น KFRY20, SEOUL50" required value="{{if .Promotion}}{{.Promotion.Code}}{{end}}">
          <div class="form-text">ตัวพิมพ์ใหญ่ ภาษาอังกฤษหรือตัวเลข (เช่น KFRY10)</div>
        </div>

        <!-- Title -->
        <div class="col-md-6">
          <label class="form-label fw-bold">ชื่อโปรโมชั่น <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" placeholder="เช่น ส่วนลดเปิดร้านฉลองปีใหม่" required value="{{if .Promotion}}{{.Promotion.Title}}{{end}}">
        </div>

        <!-- Description -->
        <div class="col-12">
          <label class="form-label fw-bold">รายละเอียดเงื่อนไข</label>
          <textarea name="description" class="form-control" rows="2" placeholder="รายละเอียดหรือเงื่อนไขการใช้ส่วนลด">{{if .Promotion}}{{.Promotion.Description}}{{end}}</textarea>
        </div>

        <!-- Discount Type -->
        <div class="col-md-6">
          <label class="form-label fw-bold">ประเภทส่วนลด <span class="text-danger">*</span></label>
          <select name="discount_type" class="form-select" id="discountTypeSelect">
            <option value="fixed" {{if .Promotion}}{{if eq .Promotion.DiscountType "fixed"}}selected{{end}}{{end}}>฿ ยอดเงินคงที่ (Fixed Amount)</option>
            <option value="percentage" {{if .Promotion}}{{if eq .Promotion.DiscountType "percentage"}}selected{{end}}{{end}}>% เปอร์เซ็นต์ (Percentage)</option>
          </select>
        </div>

        <!-- Discount Value -->
        <div class="col-md-6">
          <label class="form-label fw-bold">มูลค่าส่วนลด <span class="text-danger">*</span></label>
          <div class="input-group">
            <input type="number" name="discount_value" step="0.01" min="0.01" class="form-control" placeholder="เช่น 50 หรือ 15" required value="{{if .Promotion}}{{.Promotion.DiscountValue}}{{end}}">
            <span class="input-group-text" id="discountUnitText">{{if .Promotion}}{{if eq .Promotion.DiscountType "percentage"}}%{{else}}บาท{{end}}{{else}}บาท{{end}}</span>
          </div>
        </div>

        <!-- Minimum Order Amount -->
        <div class="col-12">
          <label class="form-label fw-bold">ยอดสั่งซื้อขั้นต่ำ (บาท)</label>
          <div class="input-group">
            <span class="input-group-text">฿</span>
            <input type="number" name="min_order_amount" step="0.01" min="0" class="form-control" placeholder="0 = ไม่มีขั้นต่ำ" value="{{if .Promotion}}{{.Promotion.MinOrderAmount}}{{else}}0{{end}}">
          </div>
          <div class="form-text">ยอดรวมในตะกร้าต้องถึงจำนวนนี้จึงจะใช้โค้ดได้</div>
        </div>

        <!-- Start Date -->
        <div class="col-md-6">
          <label class="form-label fw-bold">วัน-เวลา เริ่มต้น <span class="text-danger">*</span></label>
          <input type="datetime-local" name="start_date" class="form-control" required value="{{if .Promotion}}{{formatInputDate .Promotion.StartDate}}{{else}}{{.DefaultStart}}{{end}}">
        </div>

        <!-- End Date -->
        <div class="col-md-6">
          <label class="form-label fw-bold">วัน-เวลา สิ้นสุด <span class="text-danger">*</span></label>
          <input type="datetime-local" name="end_date" class="form-control" required value="{{if .Promotion}}{{formatInputDate .Promotion.EndDate}}{{else}}{{.DefaultEnd}}{{end}}">
        </div>

        <!-- Status Active -->
        <div class="col-12">
          <div class="form-check form-switch pt-2">
            <input class="form-check-input" type="checkbox" name="is_active" value="true" id="isActiveSwitch" {{if .Promotion}}{{if .Promotion.IsActive}}checked{{end}}{{else}}checked{{end}}>
            <label class="form-check-label fw-bold" for="isActiveSwitch">เปิดใช้งานโปรโมชั่นนี้ทันที</label>
          </div>
        </div>

        <!-- Buttons -->
        <div class="col-12 pt-3 d-flex gap-2 justify-content-end">
          <a href="/admin/promotions" class="btn btn-outline-secondary">ยกเลิก</a>
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check2 me-1"></i>{{if .Promotion}}บันทึกการแก้ไข{{else}}สร้างโปรโมชั่น{{end}}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  // Update unit label dynamically
  const select = document.getElementById('discountTypeSelect');
  const unitText = document.getElementById('discountUnitText');
  if (select && unitText) {
    select.addEventListener('change', function() {
      unitText.textContent = this.value === 'percentage' ? '%' : 'บาท';
    });
  }
</script>
{{end}}
