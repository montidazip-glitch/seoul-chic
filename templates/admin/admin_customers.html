{{template "layout.html" .}}
{{define "content"}}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="page-title"><i class="bi bi-people me-2"></i>จัดการลูกค้า</h1>
      <p class="text-muted mb-0">{{len .Customers}} สมาชิก</p>
    </div>
  </div>

  <div class="glass-card">
    <div class="table-responsive">
      <table class="table kfry-table mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>ชื่อ</th>
            <th>อีเมล</th>
            <th>วันที่สมัคร</th>
            <th>การดำเนินการ</th>
          </tr>
        </thead>
        <tbody>
          {{range .Customers}}
          <tr>
            <td class="text-muted">{{.ID}}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="customer-avatar">{{slice .Name 0 1}}</div>
                <strong>{{.Name}}</strong>
              </div>
            </td>
            <td class="text-muted">{{.Email}}</td>
            <td class="text-muted small">{{.CreatedAt.Format "02/01/2006"}}</td>
            <td>
              <form action="/admin/customers/{{.ID}}/delete" method="POST" class="d-inline"
                    onsubmit="return confirm('ลบลูกค้า {{.Name}} และข้อมูลทั้งหมด?')">
                <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
                <button type="submit" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i> ลบ
                </button>
              </form>
            </td>
          </tr>
          {{else}}
          <tr>
            <td colspan="5" class="text-center py-5 text-muted">
              <i class="bi bi-people display-6 d-block mb-2"></i>ยังไม่มีลูกค้า
            </td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</div>
{{end}}
