{{template "layout.html" .}}
{{define "content"}}
<div class="auth-wrapper d-flex align-items-center justify-content-center py-5">
  <div class="auth-card glass-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="auth-logo">🛡️</div>
      <h1 class="auth-title">Seoul Chic Admin</h1>
      <p class="text-muted">ระบบจัดการร้านไก่ทอดเกาหลีสำหรับผู้ดูแลระบบ</p>
    </div>

    <!-- ═══ กล่องตัวอย่าง User & Password สำหรับทดลองเข้าระบบ ═══ -->
    <div class="card border border-danger-subtle bg-danger-subtle bg-opacity-25 rounded-3 p-3 mb-4 shadow-sm text-start">
      <div class="d-flex align-items-center justify-content-between mb-2 flex-wrap gap-2">
        <span class="badge bg-danger text-white"><i class="bi bi-shield-lock-fill me-1"></i>ตัวอย่างสำหรับทดลองเข้าระบบแอดมิน</span>
        <button type="button" class="btn btn-sm btn-outline-danger py-1 px-2 fw-semibold" id="fillAdminBtn">
          <i class="bi bi-magic me-1"></i>คลิกเพื่อกรอกอัตโนมัติ
        </button>
      </div>
      <div class="small bg-white p-2 rounded border border-danger-subtle">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="text-muted"><i class="bi bi-person me-1"></i>User (แอดมิน):</span>
          <code class="fw-bold text-dark user-select-all" id="adminEmailText">admin@seoulchic.com</code>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="text-muted"><i class="bi bi-key me-1"></i>Password (รหัสผ่าน):</span>
          <code class="fw-bold text-dark user-select-all" id="adminPassText">admin1234</code>
        </div>
      </div>
    </div>

    <form action="/login" method="POST" id="adminLoginForm" novalidate>
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <div class="mb-3">
        <label for="adminEmail" class="form-label fw-semibold">User Admin (อีเมล)</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
          <input type="email" class="form-control" id="adminEmail" name="email"
                 placeholder="admin@seoulchic.com" value="admin@seoulchic.com" required autocomplete="email">
        </div>
      </div>
      <div class="mb-4">
        <label for="adminPassword" class="form-label fw-semibold">Password (รหัสผ่าน)</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="adminPassword" name="password"
                 placeholder="••••••••" value="admin1234" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="togglePass">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-danger btn-kfry w-100 mb-3" id="adminLoginBtn">
        <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ Admin
      </button>
    </form>
    
    <div class="text-center text-muted small">
      <a href="/login" class="text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i>กลับไปหน้าเข้าสู่ระบบลูกค้าทั่วไป
      </a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var fillAdminBtn = document.getElementById('fillAdminBtn');
  var emailInput = document.getElementById('adminEmail');
  var passInput = document.getElementById('adminPassword');

  if (fillAdminBtn) {
    fillAdminBtn.addEventListener('click', function() {
      if (emailInput && passInput) {
        emailInput.value = 'admin@seoulchic.com';
        passInput.value = 'admin1234';
        fillAdminBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i>กรอกแล้ว!';
        fillAdminBtn.classList.remove('btn-outline-danger');
        fillAdminBtn.classList.add('btn-success');
        setTimeout(function() {
          fillAdminBtn.innerHTML = '<i class="bi bi-magic me-1"></i>คลิกเพื่อกรอกอัตโนมัติ';
          fillAdminBtn.classList.remove('btn-success');
          fillAdminBtn.classList.add('btn-outline-danger');
        }, 2000);
        emailInput.focus();
      }
    });
  }
});
</script>
{{end}}
